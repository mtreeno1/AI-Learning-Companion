version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ai-companion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-aicompanion}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
      POSTGRES_DB: ${DB_NAME:-ai_learning_companion}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aicompanion}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-companion-network

  # Backend API (FastAPI + YOLO)
  backend:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: ai-companion-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-aicompanion}:${DB_PASSWORD:-changeme123}@db:5432/${DB_NAME:-ai_learning_companion}
      
      # API Configuration
      API_HOST: 0.0.0.0
      API_PORT: 8000
      
      # JWT
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost}
      
      # Recording Configuration
      RECORDINGS_PATH: /app/recordings
      RECORDING_DEFAULT_FPS: 30.0
      RECORDING_DEFAULT_RESOLUTION: 1920x1080
      RECORDING_DEFAULT_CODEC: mp4v
      RECORDING_RETENTION_DAYS: 7
      
      # Optional: Cloud Storage
      ENABLE_CLOUD_STORAGE: ${ENABLE_CLOUD_STORAGE:-false}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - ./ai-engine/recordings:/app/recordings
      - ./ai-engine/models:/app/models
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - ai-companion-network

  # Frontend (Next.js)
  frontend:
    build:
      context: ./ai-learning-companion-ui2
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: ai-companion-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - ai-companion-network

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: ai-companion-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - ai-companion-network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local

networks:
  ai-companion-network:
    driver: bridge
